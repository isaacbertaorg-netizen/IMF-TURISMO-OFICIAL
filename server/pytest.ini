# ===========================================================================
# IMF TURISMO — configuração do pytest
# Faz o servidor enxergar o pacote `app` a partir do diretório server/.
# Com a opção pythonpath definida, o pytest adiciona server/ ao sys.path,
# permitindo imports como `from app.main import app` sem instalação do pacote.
# ===========================================================================

[pytest]
pythonpath = .
testpaths = tests
